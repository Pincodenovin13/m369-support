name: Refresh web dependency lockfile

on:
  push:
    branches:
      - refactor/repository-structure-unification
    paths:
      - "apps/web/package.json"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/repository-structure-unification
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Regenerate lockfile from pinned manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Apply compatible security updates to transitive dependencies
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Commit lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches the manifest."
          else
            git commit -m "chore(web): refresh dependency lockfile"
            git push origin HEAD:refactor/repository-structure-unification
          fi

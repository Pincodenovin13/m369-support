# M369 Support — local development Docker Compose
# Starts PostgreSQL 16, Redis 7, and the API container.
# Frontend runs natively (npm run dev) for fast HMR.

name: m369-support

services:
  db:
    image: postgres:16-alpine
    container_name: m369_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: m369_support
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      M369_APP_PASSWORD: ${M369_APP_PASSWORD:?M369_APP_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/01-bootstrap-roles.sql:/docker-entrypoint-initdb.d/01-bootstrap-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d m369_support"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: m369_redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: m369_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://m369_app:${M369_APP_PASSWORD:?M369_APP_PASSWORD must be set in .env}@db:5432/m369_support
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/m369_support
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: >
      sh -c 'DATABASE_URL="$$MIGRATION_DATABASE_URL" alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload'

volumes:
  postgres_data:
